name: EverVale Engineering

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: DevSim authoritative smoke gate
        run: pnpm devsim:smoke
      - name: DevSim 8h economy baseline report
        run: pnpm devsim baseline --hours 8 --seed 1
      - name: DevSim strategic path Constitution report
        run: pnpm devsim paths --hours 8 --strong-hours 12 --seed 1
      - name: DevSim Civic long-horizon report
        run: |
          pnpm devsim scenario pure_civic --hours 12 --seed 1
          pnpm devsim scenario pure_civic --hours 24 --seed 1
          pnpm devsim scenario pure_scholar --hours 12 --seed 1
          pnpm devsim scenario pure_scholar --hours 24 --seed 1
      - name: DevSim utility sensitivity report
        run: |
          pnpm devsim sweep power_plant powerProduction 12,16,18,20,22,24,28,40 --scenario overexpand --hours 8 --seed 1
          pnpm devsim sweep water_plant waterProduction 14,16,18,20,22,26,35 --scenario overexpand --hours 8 --seed 1
      - name: DevSim Money sensitivity report
        run: pnpm devsim sweep workshop moneyPerWorker 5,6,7,8 --scenario economy_rush --hours 8 --seed 1
      - name: DevSim Workforce priority sensitivity report
        run: pnpm devsim sweep workshop priority 50,60,65,70,75,80 --scenario economy_rush --hours 8 --seed 1
      - run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: M1 browser runtime proof
        run: pnpm test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: m1-playwright-diagnostics
          path: test-results
          if-no-files-found: ignore


  postgres-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evervale
          POSTGRES_PASSWORD: evervale
          POSTGRES_DB: evervale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evervale -d evervale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://evervale:evervale@127.0.0.1:5432/evervale
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - run: npm install --global pnpm@10.15.1
      - run: pnpm install --no-frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      - name: Re-run migrations idempotently
        run: pnpm db:migrate
      - name: Postgres persistence integration
        run: pnpm --filter @evervale/persistence test:postgres
