name: EverVale Preflight

on:
  push:
    branches: [main]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install -r tools/requirements.txt

      - name: Validate canonical content
        run: python tools/validation/validate_content.py

      - name: Validate visual presentation data
        run: python tools/validation/validate_visual_presentation.py

      - name: Check generated visual identity data
        run: python tools/validation/generate_visual_identity_data.py --check

      - name: Validate 1000 world seeds
        run: python tools/validation/validate_worldgen.py --seeds 1000

      - name: Smoke long-run simulator
        run: python tools/simulation/simulate_long_run.py --trials 20

      - name: Smoke spatial combat simulator
        run: python tools/simulation/simulate_spatial_combat.py --trials 20
